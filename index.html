  :root {
    color-scheme: light;
    --azul: #0064b4;
    --azul-oscuro: #004f8f;
    --azul-palido: #e4f0fa;
    --fondo: #ffffff;
    --numero: #ffffff;
    --tenue: rgba(255, 255, 255, 0.72);
    --muy-tenue: rgba(255, 255, 255, 0.38);
    --rojo: #b3261e;
    --font-sign: 'Saira Condensed', 'Arial Narrow', Impact, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    /* Mata el zoom por doble toque de iOS; el pellizco para ampliar sigue funcionando. */
    touch-action: manipulation;
  }

  html, body { height: 100%; }
  body {
    background: var(--fondo);
    color: var(--azul);
    margin: 0;
    font-family: var(--font-sign);
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }

  .columna {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-inline: 16px;
    padding-block: 16px;
    max-width: 30rem;
    margin: 0 auto;
  }

  /* ---------- grupos (autobus / metro) ---------- */
  .grupo { display: flex; flex-direction: column; gap: 10px; }
  /* Cerrado ocupa pantalla y va centrado; desplegado se encoge y se va a la izquierda. */
  .cabecera-grupo {
    appearance: none; -webkit-appearance: none; font: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: flex-start; width: 100%;
    border: 0; border-radius: 12px;
    background: var(--color-grupo, var(--azul)); color: #fff;
    padding: 0.6rem 1rem;
    font-size: 1.05rem; letter-spacing: 0.06em; text-transform: uppercase;
    transition: padding 280ms cubic-bezier(0.22, 1, 0.36, 1),
                font-size 280ms cubic-bezier(0.22, 1, 0.36, 1),
                filter 140ms ease;
  }
  .grupo.cerrado .cabecera-grupo {
    justify-content: center;
    padding: 3.4rem 1rem;
    font-size: clamp(2.6rem, 14vw, 3.6rem);
    letter-spacing: 0.03em;

  .cabecera-grupo:active { filter: brightness(0.92); }
  .contenido-grupo { display: flex; flex-direction: column; gap: 10px; }
  .grupo.cerrado .contenido-grupo { display: none; }
  .vacio {
    border: 2px dashed rgba(0, 100, 180, 0.3); border-radius: 14px;
    padding: 0.9rem; text-align: center;
    color: rgba(0, 100, 180, 0.6); font-size: 0.88rem; line-height: 1.4;
  }

  /* ---------- tarjeta de linea ---------- */
  .linea {
    position: relative;
    overflow: hidden;
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.1em;
    min-width: 0;
    min-height: 6.9rem;
    padding: 0.75rem 1rem;
    background: var(--azul);
    border-radius: 14px;
    color: var(--numero);
    text-decoration: none;
    text-align: center;
    transform: translateZ(0);
    transition: background 120ms ease, transform 120ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .linea:active { transform: scale(0.975); background: var(--azul-oscuro); }
  .linea.coloreada:active { filter: brightness(0.92); }
  .linea:focus-visible { outline: 4px solid var(--azul-oscuro); outline-offset: 3px; }
  @media (hover: hover) { .linea:hover { background: var(--azul-oscuro); } }
  .linea.entrando { animation: entra 320ms cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes entra {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  .numero {
    font-size: clamp(2rem, 8vh, 3.6rem); line-height: 1.02;
    font-variant-numeric: tabular-nums;
    max-width: 100%; overflow-wrap: anywhere;

  /* Una sola linea siempre: lo que no cabe se recorta con puntos suspensivos. */
  .calle {
    display: flex; align-items: center; justify-content: center;
    flex-wrap: nowrap; gap: 0 0.45em;
    width: 100%; min-width: 0;
    font-size: clamp(0.72rem, 1.9vh, 0.95rem);
    line-height: 1.25; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--tenue);
    padding-inline: 0.5rem;
  }
  .calle > * {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .texto-calle { flex: 0 1 auto; }
  .icono-reloj {

    stroke: currentColor; fill: none;
    stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;

  .destino {
    flex: 0 1 auto;
    color: var(--muy-tenue);
  }
  .programado {
    display: inline-flex; align-items: center; gap: 0.32em;
    flex: none; overflow: visible; line-height: 1;
  }
  .tiempos {
    margin-top: 0.35em; min-height: 1.5em;
    display: flex; align-items: baseline; gap: 0.4em;
    font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 260ms ease;
  }
  .tiempos.visible { opacity: 1; }
  .tiempos.refrescando { opacity: 0.45; }
  .proximo { font-size: clamp(1.15rem, 3.2vh, 1.7rem); line-height: 1; }
  .siguientes { font-size: clamp(0.78rem, 2vh, 1.05rem); line-height: 1; color: var(--muy-tenue); letter-spacing: 0.04em; }
  .aviso { font-size: clamp(0.78rem, 2vh, 1rem); line-height: 1; color: var(--muy-tenue); letter-spacing: 0.05em; text-transform: uppercase; }

  .cargando::after {
    content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: 40%;

    animation: avanza 1100ms cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }
  @keyframes avanza { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

  /* ---------- panel de programacion ---------- */
  .panel {
    color: var(--azul);

  }
  @keyframes despliega {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: none; }

  /* Cada forma de avisar es un bloque cerrado, con sus propios minutos */

  .palanca {

    display: grid; grid-template-columns: 3.2rem 1fr 3.2rem;

    appearance: none; -webkit-appearance: none; font: inherit; cursor: pointer;

  .dias { display: flex; flex-direction: column; gap: 0.45rem; }

    <p class="pista">Escribe el nombre de la estación</p>
    <input class="campo" id="campo-metro" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"
           placeholder="Estrecho, Sol, Cuatro Caminos…" aria-describedby="estado-metro">
    <div class="sugerencias" id="sugerencias"></div>
    <p class="estado" id="estado-metro"></p>
    <div class="chips" id="chips-metro"></div>
  </div>
  <div class="mias" id="mias" hidden>
    <h3>Tus líneas · toca la ✕ para quitar una</h3>
    <ul id="lista-mias"></ul>
  </div>
  <button class="cerrar" id="cerrar-anadir" type="button">Cerrar</button>
</section>

<section class="hoja" id="hoja-aviso" role="dialog" aria-modal="true" aria-labelledby="titulo-aviso" aria-hidden="true">
  <div class="asa" aria-hidden="true"></div>
  <h2 id="titulo-aviso">Avisarme antes de que llegue</h2>
  <p class="pista">Elige el tipo y la línea que quieres vigilar</p>
  <p class="banner" id="banner" hidden></p>
  <div class="pestanas" role="tablist">
    <button class="pestana activa" id="aviso-bus" type="button" role="tab" aria-selected="true">Bus</button>
    <button class="pestana" id="aviso-metro" type="button" role="tab" aria-selected="false">Metro</button>
  </div>
  <div class="chips" id="chips-linea"></div>
  <p class="nota" id="pista-linea">Toca una línea para programarla.</p>
  <div id="caja-panel"></div>
  <button class="cerrar" id="cerrar-aviso" type="button">Cerrar</button>
</section>

<script>
  (function () {
    var LLAVE_LINEAS = 'paradas-emt:lineas';
    var LLAVE_EXTRAS = 'paradas-emt:extras';
    var LLAVE_PROG = 'paradas-emt:programados';
    var LLAVE_PUNT = 'paradas-emt:puntuales';
    var LLAVE_VIEJA = 'paradas-emt:aviso';
    var LLAVE_ID = 'paradas-emt:id';
    var MIN_ANTELACION = 1, MAX_ANTELACION = 45;
    var DIAS = [
      { n: 1, nombre: 'Lun' }, { n: 2, nombre: 'Mar' }, { n: 3, nombre: 'Mié' },
      { n: 4, nombre: 'Jue' }, { n: 5, nombre: 'Vie' }, { n: 6, nombre: 'Sáb' }, { n: 0, nombre: 'Dom' }
    ];
    var ICONO_RELOJ =
      '<svg class="icono-reloj" viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="9"></circle><path d="M12 6.6V12l3.4 2.1"></path></svg>';

    var columna = document.getElementById('columna');
    var velo = document.getElementById('velo');
    var hojaAnadir = document.getElementById('hoja-anadir');
    var campo = document.getElementById('campo');
    var estadoAnadir = document.getElementById('estado-anadir');
    var chips = document.getElementById('chips');
    var cajaMias = document.getElementById('mias');
    var listaMias = document.getElementById('lista-mias');
    var pestanaBus = document.getElementById('pestana-bus');
    var pestanaMetro = document.getElementById('pestana-metro');
    var panelBus = document.getElementById('panel-bus');
    var panelMetro = document.getElementById('panel-metro');
    var campoMetro = document.getElementById('campo-metro');
    var sugerencias = document.getElementById('sugerencias');
    var estadoMetro = document.getElementById('estado-metro');
    var chipsMetro = document.getElementById('chips-metro');

    var hojaAviso = document.getElementById('hoja-aviso');
    var chipsLinea = document.getElementById('chips-linea');
    var cajaPanel = document.getElementById('caja-panel');
    var pistaLinea = document.getElementById('pista-linea');
    var avisoBus = document.getElementById('aviso-bus');
    var avisoMetro = document.getElementById('aviso-metro');
    var modoAviso = 'bus';
    var banner = document.getElementById('banner');

    var tarjetas = [];
    var elegida = null;
    var ultima = 0;
    var ARRANQUE = Date.now();
    var pendienteVersion = false;

    // ---------- almacen ----------
    function leeLS(llave, pordefecto) {
      try { var v = localStorage.getItem(llave); return v ? JSON.parse(v) : pordefecto; }
      catch (e) { return pordefecto; }
    }
    function escribeLS(llave, valor) {
      try { localStorage.setItem(llave, JSON.stringify(valor)); } catch (e) {}
    }
    function extras() { var v = leeLS(LLAVE_EXTRAS, []); return Array.isArray(v) ? v : []; }

    // Antes habia cuatro lineas fijas y otras anadidas aparte. Ahora es una sola lista
    // que se puede editar entera, asi que la primera vez la construimos juntando ambas.
    function todas() {
      var v = leeLS(LLAVE_LINEAS, null);
      if (!Array.isArray(v)) {
        v = window.FIJAS.concat(extras());
        escribeLS(LLAVE_LINEAS, v);
      }
      var tocado = false;
      v.forEach(function (p) { if (!p.modo) { p.modo = 'bus'; tocado = true; } });
      if (tocado) escribeLS(LLAVE_LINEAS, v);
      return v;
    }
    function guardaLineas(v) { escribeLS(LLAVE_LINEAS, v); }
    function claveDe(p) {
      return (p.modo === 'metro' ? 'metro:' : '') + p.linea + '@' + p.parada +
        (p.destino ? '>' + p.destino : '');
    }
    function esMetro(p) { return p.modo === 'metro'; }
    function aMinutosDelDia(hhmm) {
      var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim());
      return m ? (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) : 390;
    }
    function aHoraTexto(min) {
      var v = ((min % 1440) + 1440) % 1440;
      return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
    }

    function programados() { return leeLS(LLAVE_PROG, {}) || {}; }
    function puntuales() { return leeLS(LLAVE_PUNT, {}) || {}; }

    // "06:30" | ["06:30", ...] | [{h, m}, ...]  ->  [{h, m}]
    function normalizaHoras(v) {
      if (v == null) return [];
      var lista = Array.isArray(v) ? v : [v];
      var vistas = {};
      var salida = [];
      lista.forEach(function (x) {
        var h = null, m = null;
        if (typeof x === 'string') h = x;
        else if (x && typeof x.h === 'string') {
          h = x.h;
          m = (typeof x.m === 'number' && x.m > 0) ? x.m : null;
        }
        if (!h || vistas[h]) return;
        vistas[h] = true;
        salida.push({ h: h, m: m });
      });
      return salida;
    }

    function programaDe(clave) {
      var p = programados()[clave];
      if (!p || !p.dias) {
        p = { activo: false, antelacion: 10, dias: { '1': [{ h: '06:30', m: null }], '2': [{ h: '06:30', m: null }], '3': [{ h: '06:30', m: null }], '4': [{ h: '06:30', m: null }], '5': [{ h: '06:30', m: null }] } };
      }
      if (typeof p.antelacionPuntual !== 'number') p.antelacionPuntual = 10;
      return p;
    }
    function guardaPrograma(clave, prog) {
      var todos = programados();
      todos[clave] = prog;
      escribeLS(LLAVE_PROG, todos);
    }
    function borraPrograma(clave) {
      var todos = programados();
      delete todos[clave];
      escribeLS(LLAVE_PROG, todos);
    }
    function puntualDe(clave) {
      var p = puntuales()[clave];
      if (!p) return null;
      if (p.caduca && Date.now() > p.caduca) { borraPuntual(clave); return null; }
      return p;
    }
    function guardaPuntual(clave, p) {
      var todos = puntuales();
      todos[clave] = p;
      escribeLS(LLAVE_PUNT, todos);
    }
    function borraPuntual(clave) {
      var todos = puntuales();
      delete todos[clave];
      escribeLS(LLAVE_PUNT, todos);
    }

    // La version anterior guardaba un solo aviso suelto: lo pasamos al nuevo formato.
    (function migrar() {
      var viejo = leeLS(LLAVE_VIEJA, null);
      if (!viejo || !viejo.dias || !viejo.linea) return;
      var clave = viejo.linea + '@' + viejo.parada;
      if (!programados()[clave]) {
        guardaPrograma(clave, { activo: !!viejo.activo, antelacion: viejo.antelacion || 10, dias: viejo.dias });
      }
      try { localStorage.removeItem(LLAVE_VIEJA); } catch (e) {}
    })();

    // La primera vez, dejamos puesta la linea de metro que usa a diario.
    (function primeraDeMetro() {
      if (leeLS('paradas-emt:metro-inicial', false)) return;
      escribeLS('paradas-emt:metro-inicial', true);
      var v = todas();
      var ya = v.some(function (p) { return p.modo === 'metro'; });
      if (ya) return;
      v.push({ modo: 'metro', linea: '1', parada: '4_4', calle: 'ESTRECHO', destino: 'VALDECARROS' });
      escribeLS(LLAVE_LINEAS, v);
    })();

    function miId() {
      var id = null;
      try { id = localStorage.getItem(LLAVE_ID); } catch (e) {}
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
        try { localStorage.setItem(LLAVE_ID, id); } catch (e) {}
      }
      return id;
    }

    // ---------- lectura del panel de la EMT ----------
    function minutos(texto) {
      if (/^\s*>/.test(texto)) return 61;
      var m = texto.match(/(\d+)/);
      return m ? parseInt(m[1], 10) : null;
    }
    function analizar(html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var filas = [];
      Array.prototype.forEach.call(doc.querySelectorAll('tr'), function (tr) {
        var c = tr.querySelectorAll('td');
        if (c.length < 3) return;
        var linea = c[0].textContent.trim();
        if (!/^\w+$/.test(linea) || !/\d/.test(linea)) return;
        var min = minutos(c[2].textContent.trim());
        if (min !== null) filas.push({ linea: linea, min: min });
      });
      var h2 = doc.querySelectorAll('h2');
      var calle = h2.length > 1 ? h2[1].textContent.trim() : '';
      var nombre = h2.length ? h2[0].textContent.replace(/^Parada:\s*\d+\s*/, '').trim() : '';
      return { filas: filas, calle: calle || nombre };
    }
    // Se queda con los pasos de TU linea y, en metro, de TU sentido.
    function tiemposDe(datos, linea, destino) {
      return datos.filas
        .filter(function (f) { return f.linea === linea && (!destino || f.destino === destino); })
        .map(function (f) { return f.min; })
        .sort(function (a, b) { return a - b; });
    }

    // El CRTM no deja que la web le pregunte directamente: pasa por el vigilante.
    function pedirMetro(cod) {
      return fetch(window.VIGILANTE + '/metro?cod=' + encodeURIComponent(cod), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          if (d && d.error) throw new Error(d.error);
          return { calle: d.calle || '', filas: d.filas || [] };
        });
    }

    // Devuelve siempre la misma forma, venga de donde venga.
    function datosDe(p) {
      var esMet = p.modo === 'metro';
      var pre = window.PRECARGA[(esMet ? 'metro:' : 'bus:') + p.parada];
      if (esMet) {
        if (!pre) return pedirMetro(p.parada);
        return Promise.resolve(pre).then(function (d) {
          if (!d || d.error || !d.filas) throw (d && d.error) || new Error('sin datos');
          return { calle: d.calle || '', filas: d.filas };
        });
      }
      var promesa = pre ? Promise.resolve(pre) : window.pedir(p.parada);
      return promesa.then(function (html) {
        if (typeof html !== 'string') throw html;
        return analizar(html);
      });
    }

    // ---------- notificaciones ----------
    function aBytes(b64url) {
      var b64 = (b64url + '='.repeat((4 - b64url.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
      var crudo = atob(b64);
      var salida = new Uint8Array(crudo.length);
      for (var i = 0; i < crudo.length; i++) salida[i] = crudo.charCodeAt(i);
      return salida;
    }
    function esStandalone() {
      return window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    }
    function esIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }
    function puedeAvisar() {
      return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    }
    function porQueNoPuede() {
      if (!puedeAvisar()) return 'Este navegador no admite avisos. Abre la app desde el icono de la pantalla de inicio.';
      if (esIOS() && !esStandalone()) return 'Para que suene el móvil, añade la app a la pantalla de inicio y ábrela desde ahí.';
      if (Notification.permission === 'denied') return 'Tienes las notificaciones bloqueadas. Actívalas en los ajustes del móvil.';
      return null;
    }

    function suscribir() {
      return navigator.serviceWorker.ready.then(function (reg) {
        return reg.pushManager.getSubscription().then(function (previa) {
          if (previa) return previa;
          return fetch(window.VIGILANTE + '/clave')
            .then(function (r) { return r.json(); })
            .then(function (d) {
              return reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: aBytes(d.publica)
              });
            });
        });
      }).then(function (s) { return s.toJSON(); });
    }

    function asegurarAlta() {
      var motivo = porQueNoPuede();
      if (motivo) return Promise.reject(new Error(motivo));
      if (Notification.permission === 'granted') return suscribir();
      return Notification.requestPermission().then(function (permiso) {
        if (permiso !== 'granted') throw new Error('Sin permiso de notificaciones no puedo avisarte.');
        return suscribir();
      });
    }

    function listaAvisos() {
      var prog = programados();
      var salida = [];
      todas().forEach(function (p) {
        var c = claveDe(p);
        var a = prog[c];
        if (!a) return;
        salida.push({
          modo: p.modo || 'bus', linea: p.linea, parada: p.parada, calle: p.calle,
          destino: p.destino || null,
          activo: !!a.activo, antelacion: a.antelacion || 10, dias: a.dias || {}
        });
      });
      return salida;
    }
    function listaPuntuales() {
      var pun = puntuales();
      var salida = [];
      todas().forEach(function (p) {
        var c = claveDe(p);
        var u = pun[c];
        if (!u) return;
        if (u.caduca && Date.now() > u.caduca) return;
        salida.push({
          clave: c, modo: p.modo || 'bus', linea: p.linea, parada: p.parada, calle: p.calle,
          destino: p.destino || null,
          antelacion: u.antelacion || 10, caduca: u.caduca
        });
      });
      return salida;
    }

    function sincronizar(suscripcion) {
      var cuerpo = { id: miId(), avisos: listaAvisos(), puntuales: listaPuntuales() };
      if (suscripcion) cuerpo.suscripcion = suscripcion;
      return fetch(window.VIGILANTE + '/registro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cuerpo)
      }).then(function (r) { if (!r.ok) throw new Error('el vigilante ha respondido ' + r.status); return r.json(); });
    }

    // ---------- pintado de la columna ----------
    function etiqueta(min) {
      if (min === 0) return 'llegando';
      if (min > 60) return '+60 min';
      return min + ' min';
    }
    function pinta(t, lista) {
      t.cara.classList.remove('cargando');
      t.ultimosTiempos = lista;
      if (!lista || !lista.length) {
        t.tiempos.innerHTML = '<span class="aviso">sin buses ahora</span>';
      } else {
        var resto = lista.slice(1, 3).map(function (m) { return m > 60 ? '+60' : m; });
        t.tiempos.innerHTML =
          '<span class="proximo">' + etiqueta(lista[0]) + '</span>' +
          (resto.length ? '<span class="siguientes">· ' + resto.join(' · ') + '</span>' : '');
      }
      t.tiempos.classList.remove('refrescando');
      t.tiempos.classList.add('visible');
    }
    function falla(t) {
      t.cara.classList.remove('cargando');
      t.tiempos.innerHTML = '<span class="aviso">sin conexión</span>';
      t.tiempos.classList.remove('refrescando');
      t.tiempos.classList.add('visible');
    }
    function resolver(t) {
      return datosDe(t.info)
        .then(function (datos) { pinta(t, tiemposDe(datos, t.info.linea, t.info.destino)); })
        .catch(function () { falla(t); });
    }

    function refrescaBotonReloj() {
      var b = columna.querySelector('.boton-borde.reloj');
      if (b) b.classList.toggle('encendido', hayAlgunAviso());
    }

    function pintaMarca(t) {
      if (!t || !t.cara) return;
      var caja = t.cara.querySelector('.calle');
      var vieja = caja.querySelector('.programado');
      if (vieja) vieja.remove();
      var clave = claveDe(t.info);
      var prog = programados()[clave];
      var punt = puntualDe(clave);
      if (!punt && !(prog && prog.activo)) return;

      var marca = document.createElement('span');
      marca.className = 'programado';
      marca.innerHTML = ICONO_RELOJ;
      if (punt) {
        marca.appendChild(document.createTextNode(punt.antelacion + ' min'));
        marca.setAttribute('aria-label', 'Aviso puntual con ' + punt.antelacion + ' minutos');
      } else {
        var deHoy = normalizaHoras(prog.dias[String(new Date().getDay())]);
        var hoy = deHoy.length ? deHoy.map(function (f) { return f.h; }).sort().join(' · ') : null;
        if (hoy) marca.appendChild(document.createTextNode(hoy));
        marca.setAttribute('aria-label', hoy ? 'Avisos programados hoy a las ' + hoy : 'Aviso programado');
      }
      caja.appendChild(marca);
    }

    // Cualquier cambio en los avisos se refleja en los tres sitios a la vez.
    function trasCambio(t) {
      pintaMarca(t);
      refrescaBotonReloj();
      if (typeof pintaChips === 'function') pintaChips();
    }

    // El rojo del metro sale de su propio logo; el azul es el de la EMT.
    var GRUPOS = [
      { modo: 'bus', titulo: 'Bus', color: '#0064b4', vacio: 'Sin líneas de bus. Añade una con el +.' },
      { modo: 'metro', titulo: 'Metro', color: '#ED1C23', vacio: 'Sin líneas de metro. Añade una con el +.' }
    ];
    function grupoCerrado(modo) { return leeLS('paradas-emt:cerrado:' + modo, false) === true; }
    function guardaGrupoCerrado(modo, v) { escribeLS('paradas-emt:cerrado:' + modo, !!v); }

    // Colores oficiales de cada linea, sacados del propio CRTM (GetLines.php).
    var COLORES_METRO = {"1":"#2DBEF0","2":"#ED1C24","3":"#FFD000","4":"#B65518","5":"#8FD400","6":"#98989B","7":"#EE7518","8":"#EC82B1","9":"#A60084","10":"#005AA9","11":"#009B3A","12":"#A49800","R":"#FFFFFF","ML1":"#3A7DDA","ML2":"#A60084","ML3":"#ED1C24"};

    // Sobre amarillo o blanco el texto blanco no se lee: elegimos segun el brillo.
    function textoSobre(hex) {
      var h = String(hex || '').replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      if (h.length !== 6) return '#ffffff';
      function canal(x) {
        var v = parseInt(x, 16) / 255;
        return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      }
      var L = 0.2126 * canal(h.slice(0, 2)) + 0.7152 * canal(h.slice(2, 4)) + 0.0722 * canal(h.slice(4, 6));
      return L > 0.45 ? '#13293d' : '#ffffff';
    }
    function conAlfa(hex, a) {
      var h = String(hex).replace('#', '');
      return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' +
        parseInt(h.slice(4, 6), 16) + ',' + a + ')';
    }

    function tarjetaDeLinea(p, nuevaClave) {
      var clave = claveDe(p);
      var el = document.createElement('a');
      el.className = 'linea cargando';
      if (nuevaClave && clave === nuevaClave) el.classList.add('entrando');
      el.href = esMetro(p)
        ? 'https://www.metromadrid.es/es/linea/linea-' + p.linea
        : window.URL_PARADA(p.parada);
      el.target = '_blank';
      el.rel = 'noopener';
      el.innerHTML =
        '<span class="numero"></span>' +
        '<span class="calle"><span class="texto-calle"></span></span>' +
        '<span class="tiempos"></span>';
      el.querySelector('.numero').textContent = p.linea;
      el.querySelector('.texto-calle').textContent = p.calle;

      // En metro, cada linea con su color real.
      var color = esMetro(p) ? COLORES_METRO[p.linea] : null;
      if (color) {
        var texto = textoSobre(color);
        el.classList.add('coloreada');
        el.style.background = color;
        el.style.color = texto;
        el.style.setProperty('--tenue', conAlfa(texto, 0.78));
        el.style.setProperty('--muy-tenue', conAlfa(texto, 0.5));
        // Una linea casi blanca (el Ramal) necesita contorno para no desaparecer.
        if (texto !== '#ffffff') el.style.boxShadow = 'inset 0 0 0 2px ' + conAlfa(texto, 0.18);
      }
      if (p.destino) {
        var d = document.createElement('span');
        d.className = 'destino';
        d.textContent = '→ ' + p.destino;
        el.querySelector('.calle').appendChild(d);
      }
      return { info: p, clave: clave, cara: el, tiempos: el.querySelector('.tiempos'), ultimosTiempos: null };
    }

    function render(nuevaClave) {
      var lista = todas();
      columna.textContent = '';
      tarjetas = [];
      var frag = document.createDocumentFragment();

      GRUPOS.forEach(function (g) {
        var suyas = lista.filter(function (p) {
          return (g.modo === 'metro') === esMetro(p);
        });
        var caja = document.createElement('section');
        caja.className = 'grupo' + (grupoCerrado(g.modo) ? ' cerrado' : '');

        var cab = document.createElement('button');
        cab.className = 'cabecera-grupo';
        cab.type = 'button';
        cab.setAttribute('aria-expanded', grupoCerrado(g.modo) ? 'false' : 'true');
        cab.style.setProperty('--color-grupo', g.color);
        cab.innerHTML = '<span></span>';
        cab.querySelector('span').textContent = g.titulo;
        cab.addEventListener('click', function () {
          var cerrado = !caja.classList.contains('cerrado');
          caja.classList.toggle('cerrado', cerrado);
          cab.setAttribute('aria-expanded', cerrado ? 'false' : 'true');
          guardaGrupoCerrado(g.modo, cerrado);
        });
        caja.appendChild(cab);

        var dentro = document.createElement('div');
        dentro.className = 'contenido-grupo';
        if (!suyas.length) {
          var vacio = document.createElement('p');
          vacio.className = 'vacio';
          vacio.textContent = g.vacio;
          dentro.appendChild(vacio);
        } else {
          suyas.forEach(function (p) {
            var t = tarjetaDeLinea(p, nuevaClave);
            dentro.appendChild(t.cara);
            tarjetas.push(t);
            pintaMarca(t);
          });
        }
        caja.appendChild(dentro);
        frag.appendChild(caja);
      });

      var acciones = document.createElement('div');
      acciones.className = 'acciones';
      var mas = document.createElement('button');
      mas.className = 'boton-borde mas';
      mas.type = 'button';
      mas.setAttribute('aria-label', 'Añadir una línea');
      mas.textContent = '+';
      mas.addEventListener('click', abrirAnadir);
      var reloj = document.createElement('button');
      reloj.className = 'boton-borde reloj' + (hayAlgunAviso() ? ' encendido' : '');
      reloj.type = 'button';
      reloj.setAttribute('aria-label', 'Programar un aviso');
      reloj.innerHTML = ICONO_RELOJ;
      reloj.addEventListener('click', abrirAviso);
      acciones.appendChild(mas);
      acciones.appendChild(reloj);
      frag.appendChild(acciones);
      columna.appendChild(frag);

      ultima = Date.now();
      tarjetas.forEach(function (t) { resolver(t); });
      window.PRECARGA = {};
    }

    function hayAlgunAviso() {
      var prog = programados();
      var pun = puntuales();
      var hay = false;
      todas().forEach(function (p) {
        var c = claveDe(p);
        if (prog[c] && prog[c].activo) hay = true;
        if (pun[c] && (!pun[c].caduca || Date.now() < pun[c].caduca)) hay = true;
      });
      return hay;
    }

    function refrescar() {
      ultima = Date.now();
      tarjetas.forEach(function (t) {
        if (t.tiempos.classList.contains('visible')) t.tiempos.classList.add('refrescando');
        resolver(t);
      });
    }

    // ---------- panel de cada linea ----------
    function montaPanel(t) {
      var clave = t.clave;
      var panel = document.createElement('div');
      panel.className = 'panel';
      panel.innerHTML =
        // Bloque 1: un aviso suelto para el bus que viene ahora
        '<div class="bloque bloque-puntual">' +
          '<div class="titulo-grande">Avisarme cuando le falten</div>' +
          '<div class="contador">' +
            '<button class="paso menos-p" type="button" aria-label="Un minuto menos">−</button>' +
            '<div class="cifra"><input class="min-p" type="number" inputmode="numeric" min="1" max="45" step="1" aria-label="Minutos de antelación del aviso puntual"><span>min</span></div>' +
            '<button class="paso mas-p" type="button" aria-label="Un minuto más">+</button>' +
          '</div>' +
          '<button class="secundario principal puntual" type="button"></button>' +
          '<p class="estado-bloque estado-p"></p>' +
        '</div>' +
        // Bloque 2: la rutina de cada semana
        '<div class="bloque bloque-semanal">' +
          '<div class="cabecera-bloque">' +
            '<div>' +
              '<div class="titulo">Cada semana</div>' +
              '<div class="sub">Se repite solo, los días y a la hora a la que sueles cogerlo.</div>' +
            '</div>' +
            '<label class="palanca"><input type="checkbox" class="activo"><i></i></label>' +
          '</div>' +
          '<div class="rotulo">Avisarme cuando le falten</div>' +
          '<div class="contador">' +
            '<button class="paso menos-s" type="button" aria-label="Un minuto menos">−</button>' +
            '<div class="cifra"><input class="min-s" type="number" inputmode="numeric" min="1" max="45" step="1" aria-label="Minutos de antelación del aviso semanal"><span>min</span></div>' +
            '<button class="paso mas-s" type="button" aria-label="Un minuto más">+</button>' +
          '</div>' +
          '<div class="rotulo">Días y hora a la que lo coges</div>' +
          '<div class="dias"></div>' +
          '<p class="estado-bloque estado-s"></p>' +
        '</div>' +
        '<p class="estado"></p>' +
        '<div class="fila-botones">' +
          '<button class="secundario probar" type="button">Probar</button>' +
          '<button class="secundario principal guardar" type="button">Guardar</button>' +
        '</div>' +
        '<button class="borrar" type="button">Borrar los avisos de esta línea</button>';

      cajaPanel.textContent = '';
      cajaPanel.appendChild(panel);

      var bloqueSemanal = panel.querySelector('.bloque-semanal');
      var minP = panel.querySelector('.min-p');
      var minS = panel.querySelector('.min-s');
      var botonPuntual = panel.querySelector('.puntual');
      var activo = panel.querySelector('.activo');
      var cajaDias = panel.querySelector('.dias');
      var estado = panel.querySelector('.estado');
      var estadoP = panel.querySelector('.estado-p');
      var estadoS = panel.querySelector('.estado-s');
      var botonBorrar = panel.querySelector('.borrar');

      function di(texto, esError) {
        estado.textContent = texto;
        estado.classList.toggle('error', !!esError);
      }
      function diP(texto, esError) {
        estadoP.textContent = texto || '';
        estadoP.classList.toggle('error', !!esError);
      }
      function diS(texto, esError) {
        estadoS.textContent = texto || '';
        estadoS.classList.toggle('error', !!esError);
      }
      function acota(m, pordefecto) {
        var n = parseInt(m, 10);
        if (isNaN(n)) n = pordefecto;
        return Math.min(MAX_ANTELACION, Math.max(MIN_ANTELACION, n));
      }
      function ponMinPuntual(m) {
        var prog = programaDe(clave);
        prog.antelacionPuntual = acota(m, 10);
        guardaPrograma(clave, prog);
        minP.value = prog.antelacionPuntual;
        return prog.antelacionPuntual;
      }
      function ponMinSemanal(m) {
        var prog = programaDe(clave);
        prog.antelacion = acota(m, 10);
        guardaPrograma(clave, prog);
        minS.value = prog.antelacion;
        return prog.antelacion;
      }

      function pintaPuntual() {
        var u = puntualDe(clave);
        if (u) {
          botonPuntual.textContent = 'Cancelar';
          botonPuntual.classList.add('puntual-activo');
          minP.value = u.antelacion;
          diP('Vigilando el próximo ' + t.info.linea + '. Te aviso cuando le falten ' + u.antelacion + ' min y luego se apaga.', false);
        } else {
          botonPuntual.textContent = 'Avisarme';
          botonPuntual.classList.remove('puntual-activo');
          minP.value = programaDe(clave).antelacionPuntual;
        }
        trasCambio(t);
      }

      function guardaFranjas(dn, franjas) {
        var pr = programaDe(clave);
        if (franjas.length) pr.dias[String(dn)] = franjas;
        else delete pr.dias[String(dn)];
        guardaPrograma(clave, pr);
      }

      function pintaDias() {
        var prog = programaDe(clave);
        activo.checked = !!prog.activo;
        bloqueSemanal.classList.toggle('apagada', !prog.activo);
        minS.value = prog.antelacion;
        cajaDias.textContent = '';

        DIAS.forEach(function (d) {
          var franjas = normalizaHoras(prog.dias[String(d.n)]);
          var fila = document.createElement('div');
          fila.className = 'dia' + (franjas.length ? '' : ' apagado');

          var nombre = document.createElement('span');
          nombre.className = 'nombre';
          nombre.textContent = d.nombre;
          fila.appendChild(nombre);

          var cajaHoras = document.createElement('div');
          cajaHoras.className = 'horas';

          franjas.forEach(function (f, idx) {
            var pastilla = document.createElement('span');
            pastilla.className = 'hora';

            var reloj = document.createElement('input');
            reloj.type = 'time';
            reloj.value = f.h;
            reloj.setAttribute('aria-label', 'Hora del ' + d.nombre);
            reloj.addEventListener('change', function () {
              if (!reloj.value) { reloj.value = f.h; return; }
              var lista = normalizaHoras(programaDe(clave).dias[String(d.n)]);
              lista[idx] = { h: reloj.value, m: lista[idx] ? lista[idx].m : null };
              guardaFranjas(d.n, lista);
              pintaDias();
            });

            var sep = document.createElement('span');
            sep.className = 'sep';

            var mins = document.createElement('input');
            mins.type = 'number';
            mins.className = 'mins';
            mins.min = String(MIN_ANTELACION);
            mins.max = String(MAX_ANTELACION);
            mins.inputMode = 'numeric';
            mins.value = f.m != null ? f.m : prog.antelacion;
            mins.setAttribute('aria-label', 'Minutos de aviso de las ' + f.h + ' del ' + d.nombre);
            mins.addEventListener('change', function () {
              var n = acota(mins.value, prog.antelacion);
              var lista = normalizaHoras(programaDe(clave).dias[String(d.n)]);
              if (lista[idx]) lista[idx].m = n;
              guardaFranjas(d.n, lista);
              pintaDias();
              trasCambio(t);
            });

            var etq = document.createElement('span');
            etq.className = 'min-etiqueta';
            etq.textContent = 'min';

            var quitar = document.createElement('button');
            quitar.type = 'button';
            quitar.className = 'quitar-hora';
            quitar.textContent = '✕';
            quitar.setAttribute('aria-label', 'Quitar las ' + f.h + ' del ' + d.nombre);
            quitar.addEventListener('click', function () {
              var lista = normalizaHoras(programaDe(clave).dias[String(d.n)]);
              lista.splice(idx, 1);
              guardaFranjas(d.n, lista);
              pintaDias();
              trasCambio(t);
            });

            pastilla.appendChild(reloj);
            pastilla.appendChild(sep);
            pastilla.appendChild(mins);
            pastilla.appendChild(etq);
            pastilla.appendChild(quitar);
            cajaHoras.appendChild(pastilla);
          });

          var mas = document.createElement('button');
          mas.type = 'button';
          mas.className = 'mas-hora';
          mas.textContent = franjas.length ? '+' : '+ hora';
          mas.setAttribute('aria-label', 'Añadir otra hora el ' + d.nombre);
          mas.addEventListener('click', function () {
            var lista = normalizaHoras(programaDe(clave).dias[String(d.n)]);
            // La nueva sale una hora despues de la ultima, para no repetir la misma.
            var base = lista.length ? aMinutosDelDia(lista[lista.length - 1].h) + 60 : 390;
            lista.push({ h: aHoraTexto(base), m: null });
            guardaFranjas(d.n, lista);
            pintaDias();
            trasCambio(t);
          });
          cajaHoras.appendChild(mas);

          fila.appendChild(cajaHoras);
          cajaDias.appendChild(fila);
        });
        trasCambio(t);
      }

      pintaDias();
      pintaPuntual();

      panel.querySelector('.menos-p').addEventListener('click', function () { ponMinPuntual(programaDe(clave).antelacionPuntual - 1); });
      panel.querySelector('.mas-p').addEventListener('click', function () { ponMinPuntual(programaDe(clave).antelacionPuntual + 1); });
      minP.addEventListener('change', function () { ponMinPuntual(minP.value); });
      minP.addEventListener('blur', function () { if (!puntualDe(clave)) minP.value = programaDe(clave).antelacionPuntual; });

      panel.querySelector('.menos-s').addEventListener('click', function () { ponMinSemanal(programaDe(clave).antelacion - 1); });
      panel.querySelector('.mas-s').addEventListener('click', function () { ponMinSemanal(programaDe(clave).antelacion + 1); });
      minS.addEventListener('change', function () { ponMinSemanal(minS.value); });
      minS.addEventListener('blur', function () { minS.value = programaDe(clave).antelacion; });

      // --- aviso de una sola vez ---
      botonPuntual.addEventListener('click', function () {
        if (puntualDe(clave)) {
          borraPuntual(clave);
          pintaPuntual();
          diP('Aviso cancelado.', false);
          sincronizar().catch(function () {});
          return;
        }
        var n = ponMinPuntual(minP.value);
        var ahora = t.ultimosTiempos && t.ultimosTiempos.length ? t.ultimosTiempos[0] : null;
        if (ahora === null) {
          diP('Ahora mismo la EMT no da ningún ' + t.info.linea + ' en esta parada. Inténtalo cuando aparezca alguno.', true);
          return;
        }
        diP('Preparando el aviso…', false);
        asegurarAlta().then(function (s) {
          guardaPuntual(clave, { antelacion: n, caduca: Date.now() + 2 * 3600 * 1000 });
          return sincronizar(s);
        }).then(function () {
          altaEnVigilante = true;
          pintaBanner();
          pintaPuntual();
          if (ahora <= n) diP('Al próximo ya le faltan ' + ahora + ' min, así que te avisaré enseguida.', false);
          else diP('Listo. Al próximo le faltan ' + ahora + ' min; te aviso cuando queden ' + n + '.', false);
        }).catch(function (e) {
          diP(e && e.message ? e.message : String(e), true);
          pintaBanner();
        });
      });

      // --- rutina semanal ---
      activo.addEventListener('change', function () {
        var prog = programaDe(clave);
        prog.activo = activo.checked;
        guardaPrograma(clave, prog);
        bloqueSemanal.classList.toggle('apagada', !prog.activo);
        trasCambio(t);
        if (!prog.activo) {
          diS('Repetición apagada.', false);
          sincronizar().catch(function () {});
          return;
        }
        diS('Activando…', false);
        asegurarAlta().then(function (s) { return sincronizar(s); })
          .then(function () { altaEnVigilante = true; diS('Activado. Pulsa «Probar» para comprobarlo.', false); pintaBanner(); })
          .catch(function (e) {
            // Falta el permiso, no el ajuste: guardamos igualmente la programación en el
            // vigilante para que funcione en cuanto este móvil pueda recibir avisos.
            sincronizar().catch(function () {});
            diS((e && e.message ? e.message : String(e)) + ' La programación queda guardada.', true);
            pintaBanner();
          });
      });

      panel.querySelector('.guardar').addEventListener('click', function () {
        di('Guardando…', false);
        var prog = programaDe(clave);
        var haceFalta = prog.activo || !!puntualDe(clave);
        var paso = haceFalta ? asegurarAlta() : Promise.resolve(null);
        paso.then(function (s) { return sincronizar(s); })
          .then(function () { di('Guardado.', false); trasCambio(t); })
          .catch(function (e) { di('No he podido guardar: ' + (e && e.message ? e.message : e), true); });
      });

      panel.querySelector('.probar').addEventListener('click', function () {
        di('Mandando un aviso de prueba…', false);
        asegurarAlta().then(function (s) { return sincronizar(s); }).then(function () {
          return fetch(window.VIGILANTE + '/probar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: miId(), linea: t.info.linea })
          });
        }).then(function (r) {
          return r.json().then(function (d) { return { ok: r.ok, d: d }; });
        }).then(function (res) {
          if (res.ok) di('Mandado. Debería llegarte en unos segundos.', false);
          else di('No ha salido: ' + (res.d.error || res.d.detalle || res.d.estado), true);
        }).catch(function (e) {
          di(e && e.message ? e.message : String(e), true);
        });
      });

      var esperando = false, relojConfirmacion = null;
      function reponer() {
        esperando = false;
        botonBorrar.classList.remove('confirmando');
        botonBorrar.textContent = 'Borrar los avisos de esta línea';
        clearTimeout(relojConfirmacion);
      }
      botonBorrar.addEventListener('click', function () {
        if (!esperando) {
          esperando = true;
          botonBorrar.classList.add('confirmando');
          botonBorrar.textContent = 'Pulsa otra vez para borrarlos';
          relojConfirmacion = setTimeout(reponer, 5000);
          return;
        }
        reponer();
        borraPrograma(clave);
        borraPuntual(clave);
        activo.checked = false;
        pintaPuntual();
        pintaDias();
        di('Borrado. Esta línea ya no te avisará.', false);
        sincronizar().catch(function () {});
      });
    }

    // ---------- hoja del reloj ----------
    function tarjetaDe(clave) {
      for (var i = 0; i < tarjetas.length; i++) if (tarjetas[i].clave === clave) return tarjetas[i];
      return null;
    }

    function ponModoAviso(modo) {
      modoAviso = modo;
      var esMet = modo === 'metro';
      avisoMetro.classList.toggle('activa', esMet);
      avisoBus.classList.toggle('activa', !esMet);
      avisoMetro.setAttribute('aria-selected', esMet ? 'true' : 'false');
      avisoBus.setAttribute('aria-selected', esMet ? 'false' : 'true');
      // Si la linea elegida no es de este tipo, se deselecciona.
      if (elegida) {
        var sigue = todas().some(function (p) {
          return claveDe(p) === elegida && esMetro(p) === esMet;
        });
        if (!sigue) { elegida = null; cajaPanel.textContent = ''; }
      }
      pistaLinea.hidden = !!elegida;
      pintaChips();
    }
    avisoBus.addEventListener('click', function () { ponModoAviso('bus'); });
    avisoMetro.addEventListener('click', function () { ponModoAviso('metro'); });

    function pintaChips() {
      var prog = programados();
      var pun = puntuales();
      chipsLinea.textContent = '';
      var hay = 0;
      todas().filter(function (p) {
        return esMetro(p) === (modoAviso === 'metro');
      }).forEach(function (p) {
        hay++;
        var clave = claveDe(p);
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip pequeno' + (elegida === clave ? '' : ' apagado');
        b.appendChild(document.createTextNode(p.linea));
        if (esMetro(p)) {
          var m = document.createElement('span');
          m.className = 'marca-metro';
          m.textContent = 'M';
          b.appendChild(m);
        }
        var tieneAviso = (prog[clave] && prog[clave].activo) ||
          (pun[clave] && (!pun[clave].caduca || Date.now() < pun[clave].caduca));
        if (tieneAviso) {
          var punto = document.createElement('span');
          punto.className = 'punto';
          b.appendChild(punto);
        }
        b.setAttribute('aria-pressed', elegida === clave ? 'true' : 'false');
        b.setAttribute('aria-label', 'Programar la línea ' + p.linea + ' en ' + p.calle +
          (p.destino ? ' hacia ' + p.destino : '') + (tieneAviso ? ', ya tiene aviso' : ''));
        b.addEventListener('click', function () {
          if (elegida === clave) { elegida = null; cajaPanel.textContent = ''; }
          else { elegida = clave; var t = tarjetaDe(clave); if (t) montaPanel(t); }
          pistaLinea.hidden = !!elegida;
          pintaChips();
        });
        chipsLinea.appendChild(b);
      });
      pistaLinea.textContent = hay
        ? 'Toca una línea para programarla.'
        : (modoAviso === 'metro' ? 'No tienes líneas de metro guardadas.' : 'No tienes líneas de bus guardadas.');
      if (!hay) pistaLinea.hidden = false;
    }

    function abrirAviso() {
      pintaBanner();
      reconciliar();
      if (!elegida) cajaPanel.textContent = '';
      var actual = todas().filter(function (p) { return claveDe(p) === elegida; })[0];
      ponModoAviso(actual ? (esMetro(actual) ? 'metro' : 'bus') : modoAviso);
      pistaLinea.hidden = !!elegida;
      if (elegida) { var t = tarjetaDe(elegida); if (t) montaPanel(t); }
      abrirHoja(hojaAviso);
    }

    // El vigilante borra el aviso puntual en cuanto salta. Aqui nos enteramos
    // de ello y quitamos el puntito, que si no se quedaba para siempre.
    var ultimaReconciliacion = 0;
    var altaEnVigilante = null;
    function reconciliar(forzar) {
      if (!forzar && Date.now() - ultimaReconciliacion < 15000) return Promise.resolve();
      ultimaReconciliacion = Date.now();
      return fetch(window.VIGILANTE + '/registro?id=' + encodeURIComponent(miId()))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d) { altaEnVigilante = !!d.suscripcion; pintaBanner(); }
          if (!d || !Array.isArray(d.puntuales)) return;
          var vivos = {};
          d.puntuales.forEach(function (u) { if (u && u.clave) vivos[u.clave] = true; });
          var locales = puntuales();
          var cambio = false;
          Object.keys(locales).forEach(function (c) {
            if (!vivos[c]) { delete locales[c]; cambio = true; }
          });
          if (!cambio) return;
          escribeLS(LLAVE_PUNT, locales);
          tarjetas.forEach(function (x) { pintaMarca(x); });
          refrescaBotonReloj();
          if (abierta === hojaAviso) {
            pintaChips();
            if (elegida) { var tt = tarjetaDe(elegida); if (tt) montaPanel(tt); }
          }
        })
        .catch(function () {});
    }

    // Si hay avisos guardados y el movil puede recibirlos, nos damos de alta solos.
    function autoRegistro() {
      if (!hayAlgunAviso()) return;
      if (porQueNoPuede()) return;
      if (Notification.permission !== 'granted') return;
      suscribir().then(function (s) { return sincronizar(s); }).catch(function () {});
    }

    // Siempre visible: que nunca haya que adivinar por que un aviso no se activa.
    function pintaBanner() {
      banner.hidden = false;
      var motivo = porQueNoPuede();
      if (motivo) {
        banner.className = 'banner';
        banner.textContent = motivo;
        return;
      }
      if (Notification.permission !== 'granted') {
        banner.className = 'banner bien';
        banner.textContent = 'La primera vez que actives un aviso te pediré permiso para las notificaciones.';
        return;
      }
      banner.hidden = true;
    }

    // ---------- anadir metro ----------
    var ESTACIONES = window.ESTACIONES_METRO || [];

    function sinTildes(s) {
      return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
    }

    function buscaEstaciones(texto) {
      var q = sinTildes(texto).trim();
      if (q.length < 2) return [];
      var empiezan = [], contienen = [];
      ESTACIONES.forEach(function (e) {
        var n = sinTildes(e.n);
        if (n.indexOf(q) === 0) empiezan.push(e);
        else if (n.indexOf(q) !== -1) contienen.push(e);
      });
      return empiezan.concat(contienen).slice(0, 12);
    }

    // ---------- hoja de anadir ----------
    var abierta = null;
    function abrirHoja(h) {
      abierta = h;
      h.style.transform = '';
      h.scrollTop = 0;
      velo.classList.add('abierto');
      h.classList.add('abierta');
      h.setAttribute('aria-hidden', 'false');
    }
    function cerrarHoja() {
      if (!abierta) return;
      velo.style.opacity = '';
      velo.classList.remove('abierto');
      abierta.classList.remove('abierta');
      abierta.setAttribute('aria-hidden', 'true');
      abierta = null;
    }

    function hazArrastrable(h) {
      var inicioY = 0, inicioX = 0, recorrido = 0, activa = false, decidido = false;
      var arranque = 0, ultimaY = 0, ultimoT = 0, velocidad = 0, pendiente = null;

      function dibuja() {
        pendiente = null;
        h.style.transform = 'translate3d(0,' + recorrido + 'px,0)';
        velo.style.opacity = String(Math.max(0, 1 - recorrido / 420));
      }

      h.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1 || h.scrollTop > 0) { activa = false; return; }
        inicioY = ultimaY = e.touches[0].clientY;
        inicioX = e.touches[0].clientX;
        arranque = ultimoT = Date.now();
        recorrido = 0; velocidad = 0;
        activa = true; decidido = false;
      }, { passive: true });

      h.addEventListener('touchmove', function (e) {
        if (!activa) return;
        var y = e.touches[0].clientY;
        var dy = y - inicioY;
        var dx = e.touches[0].clientX - inicioX;

        if (!decidido) {
          // Hacia arriba o de lado no es un cierre: dejamos el gesto a la pagina.
          if (dy < 4 || Math.abs(dx) > Math.abs(dy)) { activa = false; return; }
          decidido = true;
          h.classList.add('arrastrando');
          velo.classList.add('arrastrando');
        }
        if (h.scrollTop > 0) return;
        e.preventDefault();

        var ahora = Date.now();
        var paso = ahora - ultimoT;
        if (paso > 0) velocidad = (y - ultimaY) / paso; // px por ms
        ultimaY = y; ultimoT = ahora;

        // El dedo manda: seguimos el dedo 1:1 y pintamos una sola vez por fotograma.
        recorrido = Math.max(0, dy);
        if (pendiente === null) pendiente = requestAnimationFrame(dibuja);
      }, { passive: false });

      function soltar() {
        if (!activa) return;
        activa = false;
        if (pendiente !== null) { cancelAnimationFrame(pendiente); pendiente = null; }
        if (!decidido) return;

        // Devolvemos las transiciones ANTES de mover: asi la animacion arranca
        // desde donde se quedo el dedo, sin el salto de volver arriba primero.
        h.classList.remove('arrastrando');
        velo.classList.remove('arrastrando');

        var cierra = recorrido > 90 || (velocidad > 0.45 && recorrido > 24);
        if (!cierra) {
          h.style.transform = '';
          velo.style.opacity = '';
          recorrido = 0;
          return;
        }

        h.style.transform = 'translate3d(0,101%,0)';
        velo.classList.remove('abierto');
        velo.style.opacity = '';
        recorrido = 0;

        var hecho = false;
        function fin() {
          if (hecho) return;
          hecho = true;
          h.removeEventListener('transitionend', fin);
          h.style.transform = '';
          cerrarHoja();
        }
        h.addEventListener('transitionend', fin);
        setTimeout(fin, 420);
      }
      h.addEventListener('touchend', soltar);
      h.addEventListener('touchcancel', soltar);
    }

    hazArrastrable(hojaAnadir);
    hazArrastrable(hojaAviso);

    velo.addEventListener('click', cerrarHoja);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarHoja(); });
    document.getElementById('cerrar-anadir').addEventListener('click', cerrarHoja);
    document.getElementById('cerrar-aviso').addEventListener('click', cerrarHoja);

    var buscadas = {};
    var ultimoTexto = '';
    var temporizador = null;

    var modoAnadir = 'bus';
    function ponPestana(modo) {
      modoAnadir = modo;
      var esMet = modo === 'metro';
      pestanaMetro.classList.toggle('activa', esMet);
      pestanaBus.classList.toggle('activa', !esMet);
      pestanaMetro.setAttribute('aria-selected', esMet ? 'true' : 'false');
      pestanaBus.setAttribute('aria-selected', esMet ? 'false' : 'true');
      panelMetro.hidden = !esMet;
      panelBus.hidden = esMet;
      pintaMias();
      setTimeout(function () { (esMet ? campoMetro : campo).focus(); }, 80);
    }
    pestanaBus.addEventListener('click', function () { ponPestana('bus'); });
    pestanaMetro.addEventListener('click', function () { ponPestana('metro'); });

    function diMetro(texto, esError) {
      estadoMetro.textContent = texto || '';
      estadoMetro.classList.toggle('error', !!esError);
    }

    function pintaSugerencias() {
      var encontradas = buscaEstaciones(campoMetro.value);
      sugerencias.textContent = '';
      chipsMetro.textContent = '';
      if (!campoMetro.value.trim()) { diMetro('', false); return; }
      if (!encontradas.length) { diMetro('Ninguna estación con ese nombre.', true); return; }
      diMetro('', false);
      encontradas.forEach(function (e) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'sugerencia';
        b.textContent = e.n;
        b.addEventListener('click', function () { eligeEstacion(e); });
        sugerencias.appendChild(b);
      });
    }

    function eligeEstacion(e) {
      sugerencias.textContent = '';
      chipsMetro.textContent = '';
      campoMetro.value = e.n;
      campoMetro.blur();
      diMetro('Mirando qué pasa por ' + e.n + '…', false);

      // Una estación grande tiene un código por andén, y no todos traen las mismas
      // líneas: preguntamos por todos y juntamos lo que salga.
      Promise.all(e.c.map(function (cod) {
        return pedirMetro(cod)
          .then(function (d) { return { cod: cod, datos: d }; })
          .catch(function () { return null; });
      })).then(function (respuestas) {
        var nombre = e.n;
        var filas = [];
        respuestas.forEach(function (r) {
          if (!r) return;
          if (r.datos.calle) nombre = r.datos.calle;
          r.datos.filas.forEach(function (f) {
            filas.push({ linea: f.linea, destino: f.destino, min: f.min, cod: r.cod });
          });
        });
        var datos = { calle: nombre, filas: filas };
        if (!datos.filas.length) {
          diMetro('Ahora mismo no hay trenes anunciados en ' + e.n + '. Prueba en horario de servicio.', true);
          return;
        }
        var yaTengo = {};
        todas().forEach(function (x) { yaTengo[claveDe(x)] = true; });
        var vistas = {};
        diMetro('Elige línea y sentido:', false);
        datos.filas.sort(function (a, b) {
          var na = parseInt(a.linea, 10), nb = parseInt(b.linea, 10);
          if (na !== nb) return (isNaN(na) ? 99 : na) - (isNaN(nb) ? 99 : nb);
          return a.destino < b.destino ? -1 : 1;
        });
        datos.filas.forEach(function (f) {
          var llave = f.linea + '>' + f.destino;
          if (vistas[llave]) return;
          vistas[llave] = true;
          var nueva = {
            modo: 'metro', linea: f.linea, parada: f.cod,
            calle: datos.calle || e.n, destino: f.destino
          };
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'chip destino-chip';
          b.innerHTML = '<b></b><br>';
          b.querySelector('b').textContent = 'Línea ' + f.linea;
          b.appendChild(document.createTextNode('→ ' + f.destino));
          if (yaTengo[claveDe(nueva)]) {
            b.classList.add('ya');
            b.disabled = true;
          } else {
            b.addEventListener('click', function () {
              var v = todas();
              v.push(nueva);
              guardaLineas(v);
              cerrarHoja();
              campoMetro.value = '';
              chipsMetro.textContent = '';
              diMetro('', false);
              render(claveDe(nueva));
            });
          }
          chipsMetro.appendChild(b);
        });
      }).catch(function () {
        diMetro('No he podido leer esa estación. Inténtalo de nuevo.', true);
      });
    }

    var relojMetro = null;
    campoMetro.addEventListener('input', function () {
      clearTimeout(relojMetro);
      relojMetro = setTimeout(pintaSugerencias, 120);
    });

    function abrirAnadir() {
      ponPestana('bus');
      pintaMias();
      abrirHoja(hojaAnadir);
      setTimeout(function () { campo.focus(); }, 120);
    }
    function numeroDeParada(texto) {
      var t = (texto || '').trim();
      if (!t) return null;
      var m = t.match(/stopnum=(\d{1,5})/i);
      if (m) return m[1];
      if (/^\d{1,5}$/.test(t)) return t;
      return null;
    }
    function diAnadir(texto, esError) {
      estadoAnadir.textContent = texto;
      estadoAnadir.classList.toggle('error', !!esError);
    }
    function buscar(parada) {
      chips.textContent = '';
      diAnadir('Buscando la parada ' + parada + '…', false);
      var p = buscadas[parada] || (buscadas[parada] = window.pedir(parada));
      p.then(function (html) {
        var datos = analizar(html);
        if (!datos.filas.length) {
          diAnadir('La parada ' + parada + ' no da ninguna línea ahora mismo.', true);
          return;
        }
        var yaTengo = {};
        todas().forEach(function (x) { yaTengo[claveDe(x)] = true; });
        var vistas = {};
        diAnadir(datos.calle ? 'Parada ' + parada + ' · ' + datos.calle : 'Parada ' + parada, false);
        datos.filas.forEach(function (f) {
          if (vistas[f.linea]) return;
          vistas[f.linea] = true;
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'chip';
          b.textContent = f.linea;
          if (yaTengo[f.linea + '@' + parada]) {
            b.classList.add('ya');
            b.disabled = true;
            b.setAttribute('aria-label', 'Línea ' + f.linea + ', ya la tienes');
          } else {
            b.setAttribute('aria-label', 'Añadir la línea ' + f.linea);
            b.addEventListener('click', function () {
              var v = todas();
              v.push({ linea: f.linea, parada: parada, calle: datos.calle });
              guardaLineas(v);
              cerrarHoja();
              campo.value = '';
              ultimoTexto = '';
              chips.textContent = '';
              diAnadir('', false);
              render(f.linea + '@' + parada);
            });
          }
          chips.appendChild(b);
        });
      }).catch(function () {
        delete buscadas[parada];
        diAnadir('No he podido leer esa parada. Revisa el enlace o inténtalo de nuevo.', true);
      });
    }
    function pintaMias() {
      var esMet = modoAnadir === 'metro';
      var v = todas().filter(function (p) { return esMetro(p) === esMet; });
      var titulo = cajaMias.querySelector('h3');
      if (titulo) {
        titulo.textContent = (esMet ? 'Tus líneas de metro' : 'Tus líneas de bus') + ' · toca la ✕ para quitar una';
      }
      listaMias.textContent = '';
      cajaMias.hidden = v.length === 0;
      v.forEach(function (p, i) {
        var li = document.createElement('li');
        var etq = document.createElement('span');
        etq.className = 'etiqueta';
        etq.appendChild(document.createTextNode('Línea ' + p.linea));
        var small = document.createElement('small');
        small.textContent = esMetro(p)
          ? 'Metro · ' + p.calle + (p.destino ? ' → ' + p.destino : '')
          : p.calle + ' · parada ' + p.parada;
        etq.appendChild(small);
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'quitar';
        b.textContent = '✕';
        b.setAttribute('aria-label', 'Quitar la línea ' + p.linea);
        b.addEventListener('click', function () {
          var lista = todas();
          var donde = -1;
          for (var k = 0; k < lista.length; k++) {
            if (claveDe(lista[k]) === claveDe(p)) { donde = k; break; }
          }
          if (donde === -1) return;
          var fuera = lista.splice(donde, 1)[0];
          guardaLineas(lista);
          if (fuera) {
            borraPrograma(claveDe(fuera));
            borraPuntual(claveDe(fuera));
            if (elegida === claveDe(fuera)) { elegida = null; cajaPanel.textContent = ''; }
          }
          pintaMias();
          render();
          sincronizar().catch(function () {});
        });
        li.appendChild(etq);
        li.appendChild(b);
        listaMias.appendChild(li);
      });
    }
    campo.addEventListener('input', function () {
      var texto = campo.value;
      if (texto === ultimoTexto) return;
      ultimoTexto = texto;
      clearTimeout(temporizador);
      chips.textContent = '';
      if (!texto.trim()) { diAnadir('', false); return; }
      var parada = numeroDeParada(texto);
      if (!parada) { diAnadir('Pega un enlace con stopnum=… o escribe el número de parada.', true); return; }
      temporizador = setTimeout(function () { buscar(parada); }, 250);
    });
    campo.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var parada = numeroDeParada(campo.value);
        if (parada) buscar(parada);
      }
    });

    // ---------- arranque ----------
    render();
    reconciliar(true);
    autoRegistro();

    setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      refrescar();
      reconciliar();
    }, 30000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (pendienteVersion && !abierta) { location.reload(); return; }
      reconciliar();
      if (Date.now() - ultima > 10000) refrescar();
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && Date.now() - ultima > 10000) refrescar();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (!e.data) return;
        if (e.data.tipo === 'aviso-lanzado') { reconciliar(true); return; }
        if (e.data.tipo === 'version-nueva') {
          // Nada de recargar mientras estas usando la app: solo si acabas de abrirla.
          if (abierta || Date.now() - ARRANQUE > 4000) { pendienteVersion = true; return; }
          location.reload();
        }
      });
    }
  })();
</script>
</body>
</html>
