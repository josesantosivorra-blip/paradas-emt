<script>
  // Arranca las peticiones antes de pintar nada: gana ~100 ms en movil.
  window.PARADAS = [
    { linea: '126', parada: '1574', calle: 'Francos Rodríguez, 21' },
    { linea: '147', parada: '5340', calle: 'Castellana, 87' },
    { linea: '3',   parada: '1858', calle: 'Bravo Murillo, 219' },
    { linea: '128', parada: '1572', calle: 'Lope de Haro, 8' }
  ];
  window.URL_PARADA = (n) => 'https://www.emtmadrid.es/PMVVisor/pmv.aspx?stopnum=' + n + '&size=3';
  window.pedir = (n) => {
    const ctrl = new AbortController();
    const corta = setTimeout(() => ctrl.abort(), 7000);
    return fetch(window.URL_PARADA(n), { cache: 'no-store', signal: ctrl.signal })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .finally(() => clearTimeout(corta));
  };
  window.PRECARGA = window.PARADAS.map((p) => window.pedir(p.parada).catch((e) => e));
</script>

  :root {
    color-scheme: light;
    --azul: #0064b4;
    --azul-oscuro: #004f8f;
    --fondo: #ffffff;
    --numero: #ffffff;
    --tenue: rgba(255, 255, 255, 0.72);
    --muy-tenue: rgba(255, 255, 255, 0.38);
    --font-sign: 'Saira Condensed', 'Arial Narrow', Impact, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    background: var(--fondo);
    color: var(--azul);
    margin: 0;
    font-family: var(--font-sign);
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }

  .columna {
    height: 100%;
    display: grid;
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: 10px;
    padding-inline: 16px;
    padding-block: 16px;
    max-width: 30rem;
    margin: 0 auto;
    min-height: 26rem;
  }

  .linea {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.1em;
    min-width: 0;
    padding: 0.5rem 1rem;
    background: var(--azul);
    border-radius: 14px;
    color: var(--numero);
    text-decoration: none;
    transform: translateZ(0);
    transition: background 120ms ease, transform 120ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .linea:active { transform: scale(0.975); background: var(--azul-oscuro); }
  .linea:focus-visible { outline: 4px solid var(--azul-oscuro); outline-offset: 3px; }
  @media (hover: hover) {
    .linea:hover { background: var(--azul-oscuro); }
  }

  .numero {
    font-size: clamp(2.1rem, 8.5vh, 3.9rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .calle {
    font-size: clamp(0.72rem, 1.9vh, 0.95rem);
    line-height: 1.2;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--tenue);
    text-align: center;
    text-wrap: balance;
  }

  .tiempos {
    margin-top: 0.35em;
    min-height: 1.5em;
    display: flex;
    align-items: baseline;
    gap: 0.4em;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity 260ms ease;
  }
  .tiempos.visible { opacity: 1; }
  .tiempos.refrescando { opacity: 0.45; }

  .proximo {
    font-size: clamp(1.15rem, 3.2vh, 1.7rem);
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .siguientes {
    font-size: clamp(0.78rem, 2vh, 1.05rem);
    line-height: 1;
    color: var(--muy-tenue);
    letter-spacing: 0.04em;
  }
  .aviso {
    font-size: clamp(0.78rem, 2vh, 1rem);
    line-height: 1;
    color: var(--muy-tenue);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* Barra fina de carga, sin spinners que den saltos */
  .cargando::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 40%;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 3px;
    animation: avanza 1100ms cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }
  @keyframes avanza {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .linea, .tiempos { transition: none; }
    .linea:active { transform: none; }
    .cargando::after { animation: none; width: 100%; opacity: 0.25; }
  }
</style>
</head>
<body>
<main class="columna" id="columna"></main>
<script>
  (function () {
    var columna = document.getElementById('columna');
    var tarjetas = [];

    // Pintamos la estructura de golpe; los tiempos llegan despues.
    var fragmento = document.createDocumentFragment();
    window.PARADAS.forEach(function (p) {
      var a = document.createElement('a');
      a.className = 'linea cargando';
      a.href = window.URL_PARADA(p.parada);
      a.innerHTML =
        '<span class="numero">' + p.linea + '</span>' +
        '<span class="calle">' + p.calle + '</span>' +
        '<span class="tiempos"></span>';
      fragmento.appendChild(a);
      tarjetas.push({ info: p, nodo: a, tiempos: a.querySelector('.tiempos') });
    });
    columna.appendChild(fragmento);

    function minutos(texto) {
      if (/^\s*>/.test(texto)) return 61;
      var m = texto.match(/(\d+)/);
      return m ? parseInt(m[1], 10) : null;
    }

    function leer(html, linea) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var filas = Array.prototype.slice.call(doc.querySelectorAll('tr'));
      var salida = [];
      filas.forEach(function (tr) {
        var celdas = tr.querySelectorAll('td');
        if (celdas.length < 3) return;
        if (celdas[0].textContent.trim() !== linea) return;
        var min = minutos(celdas[2].textContent.trim());
        if (min !== null) salida.push(min);
      });
      return salida.sort(function (a, b) { return a - b; });
    }

    function etiqueta(min) {
      if (min === 0) return 'llegando';
      if (min > 60) return '+60 min';
      return min + ' min';
    }

    function pinta(tarjeta, lista) {
      var caja = tarjeta.tiempos;
      tarjeta.nodo.classList.remove('cargando');
      if (!lista || !lista.length) {
        caja.innerHTML = '<span class="aviso">sin buses ahora</span>';
      } else {
        var resto = lista.slice(1, 3).map(function (m) { return m > 60 ? '+60' : m; });
        caja.innerHTML =
          '<span class="proximo">' + etiqueta(lista[0]) + '</span>' +
          (resto.length ? '<span class="siguientes">· ' + resto.join(' · ') + '</span>' : '');
      }
      caja.classList.remove('refrescando');
      caja.classList.add('visible');
    }

    function falla(tarjeta) {
      tarjeta.nodo.classList.remove('cargando');
      tarjeta.tiempos.innerHTML = '<span class="aviso">sin conexión</span>';
      tarjeta.tiempos.classList.remove('refrescando');
      tarjeta.tiempos.classList.add('visible');
    }

    function resolver(tarjeta, promesa) {
      return promesa.then(function (html) {
        if (typeof html !== 'string') throw html;
        pinta(tarjeta, leer(html, tarjeta.info.linea));
      }).catch(function () { falla(tarjeta); });
    }

    // Primera pintada: usamos las peticiones lanzadas en la cabecera.
    tarjetas.forEach(function (t, i) { resolver(t, Promise.resolve(window.PRECARGA[i])); });

    var ultima = Date.now();
    function refrescar() {
      ultima = Date.now();
      tarjetas.forEach(function (t) {
        if (t.tiempos.classList.contains('visible')) t.tiempos.classList.add('refrescando');
        resolver(t, window.pedir(t.info.parada));
      });
    }

    setInterval(function () {
      if (document.visibilityState === 'visible') refrescar();
    }, 30000);

    // Al volver a la app (desde la web de la EMT o del fondo) los datos ya estan frescos.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Date.now() - ultima > 10000) refrescar();
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && Date.now() - ultima > 10000) refrescar();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  })();
</script>
</body>
</html>
